  },
  ready(on) { $('#l-main').disabled = !on; },
  nextOnly(label = 'Continue') { const b = $('#l-main'); b.textContent = label; b.disabled = false; this.mode = 'next'; },
  skipAllowed(label) { const s = $('#l-skip'); s.hidden = false; s.textContent = label; s.onclick = () => this.next(); },
  /** info: {you, weight, correctCount, show:{t,r,en}|string, why, teach} */
  grade(ok, info = {}) {
    const step = this.queue[this.i], p = P(), mc = MASCOTS[p.mascot];
    const n = info.weight || 1, good = info.correctCount ?? (ok ? n : 0);
    this.graded += n; this.correct += good; this.locked = true;
    if (step.srsId) { if (!ok) this.missed.add(step.srsId); SRS.update(step.srsId, ok && !this.missed.has(step.srsId)); }
    if (ok) {

      if (this.combo > 0 && this.combo % 5 === 0) { this.comboFlash(); Quests.bump('combo5'); }

    } else {

      if (!this.practiceMode()) { Hearts.lose(); this.drawHearts(); if (Hearts.left() <= 0) this.outOfHearts = true; }
    }
    const title = ok ? pick(mc.praise) : fill(pick(mc.oops), { you: info.you || '…', right: typeof info.show === 'string' ? info.show : (info.show?.t || step.answer || '…') });

      if (show.r) d.push(`<small>${esc(show.r)}</small>`);

    } else if (meta.mode === 'test' || meta.mode === 'jump') {

        xp = 20; gems = 20; headline = meta.mode === 'jump' ? 'You jumped ahead!' : 'Unit mastered!'; p.stats.tests++;
        if (meta.mode === 'jump') c.units.slice(0, meta.unit.index).forEach(u => { LS().path[u.id] = Math.max(unitProgress(p, c.code, u.id), UNIT_LESSONS); });
        LS().path[meta.unit.id] = UNIT_LESSONS + 1;
      } else { xp = 5; headline = 'So close!'; extra = `You need 80% to pass. You got ${Math.round(acc * 100)}%. Review the guidebook and try again.`; }
    } else {
      const prog = unitProgress(p, c.code, meta.unit.id), first = meta.level === prog;
      xp = first ? 10 : 5; xp += perfect ? 5 : 0; xp += Math.floor(this.maxCombo / 5);
      gems = first ? 5 + (perfect ? 5 : 0) : 0;
      if (first) LS().path[meta.unit.id] = prog + 1;
      if (first && prog + 1 === UNIT_LESSONS) { extra = `Unit “${meta.unit.title}” complete! The next unit is unlocked, and the trophy test is ready.`; gems += 10; }
    }
    p.stats.lessons++; LS().lessons++; if (perfect) { p.stats.perfect++; Quests.bump('perfect'); }
    if (meta.mode !== 'practice' && meta.mode !== 'place') Quests.bump('lesson');
    p.gems += gems;
    award(xp); checkAchievements(); Store.save();
    const verdict = acc >= .95 ? 'Amazing' : acc >= .8 ? 'Great' : acc >= .6 ? 'Good' : 'Keep going';
    $('#l-bar').style.width = '100%';
    $('#l-stage').innerHTML = `<div class="l-inner done-screen"><div class="mascot" id="done-m"></div>
      <h2>${headline}</h2>${extra ? `<p class="muted" style="margin:0">${esc(extra)}</p>` : ''}
      <div class="tiles"><div><small>Total XP</small><b>${xp}</b></div><div><small>${verdict}</small><b>${Math.round(acc * 100)}%</b></div><div><small>Best combo</small><b>${this.maxCombo}</b></div></div>
      ${gems ? `<div class="levelup">+${gems} gems</div>` : ''}
      <p class="muted">${esc(perfect ? pick(MASCOTS[p.mascot].praise) : 'Every mistake unlocked a joke in your Joke jar. Worth it.')}</p></div>`;
    paintMascot($('#done-m'), p.mascot, acc >= .6 ? 'cheer' : 'giggle');
    $('#l-foot').className = 'l-foot'; $('#l-fb').hidden = true; $('#l-skip').hidden = true;
    const b = $('#l-main'); b.textContent = 'Continue'; b.disabled = false; this.mode = 'done';
    Sfx.complete(); if (acc >= .6) confetti(); Mascot.set('cheer', `Nice work! +${xp} XP`);
  },
  askQuit() {
    if (this.finished) return this.close();
    const m = $('#modal'); m.hidden = false;
    m.innerHTML = `<div class="panel"><div class="mascot" id="quit-m"></div><h3>Wait, don’t go!</h3><p>You’ll lose your progress in this lesson.</p>
      <button class="btn primary" id="q-stay">Keep learning</button><button class="btn ghost" id="q-quit">End session</button></div>`;
    paintMascot($('#quit-m'), P().mascot, 'shocked');
    $('#q-stay').onclick = () => { m.hidden = true; }; $('#q-quit').onclick = () => this.close();
  }
};

function bubblePrompt(el, inner) { el.insertAdjacentHTML('beforeend', `<div class="prompt-row"><div class="mascot" data-pm></div><div class="say-bubble">${inner}</div></div>`); paintMascot($('[data-pm]', el), P().mascot, 'happy'); }
function hintFor(tok) {
  const clean = tok.replace(/[.,!?،؟]/g, ''); let best = null;
  for (const w of vocabPool(course())) if (clean.startsWith(w.t.split(' ')[0]) && (!best || w.t.length > best.t.length)) best = w;
  return best ? `${best.t} = ${best.en}` : 'Tap to hear it';
}

async function chatMic() {
  const btn = $('#mic');

/* =====================================================================
   GLOBAL WIRING & BOOT
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target;
  const say = t.closest('[data-say]'); if (say) { Voice.speak(say.dataset.say, course().tts, say.dataset.rate ? +say.dataset.rate : .9); if (!say.closest('.hw')) return; }
  const node = t.closest('[data-node]'); if (node) { showNodePop(node.dataset.node); Sfx.tap(); return; }
  const go = t.closest('[data-go]'); if (go) { const [uid, i, mode] = go.dataset.go.split(':'); startLesson(uid, +i, mode); return; }
  const tab = t.closest('[data-tab]'); if (tab) { showTab(tab.dataset.tab); return; }
  const lang = t.closest('[data-lang]'); if (lang) { setLang(lang.dataset.lang); return; }
  const sh = t.closest('[data-sheet]'); if (sh) { ({ streak: streakSheet, gems: () => { showTab('quests'); }, hearts: () => heartsSheet(false), lang: langSheet })[sh.dataset.sheet](); return; }
  const g = t.closest('[data-guide]'); if (g) { openGuide(g.dataset.guide); return; }
  if (t.closest('[data-scenes]')) { scenesSheet(); return; }
  const tp = t.closest('[data-topic]'); if (tp) { if (!Tutor.busy) { closeSheet(); Tutor.start(tp.dataset.topic); renderChatHead(); } return; }
  const sk = t.closest('[data-skip-section]'); if (sk) { skipSectionSheet(+sk.dataset.skipSection); return; }
  const sn = t.closest('[data-skip-now]'); if (sn) { skipSection(+sn.dataset.skipNow); return; }
  const stest = t.closest('[data-skip-test]'); if (stest) { closeSheet(); placementTest(+stest.dataset.skipTest); return; }
  const pr = t.closest('[data-practice]'); if (pr) { closeSheet(); startPractice(pr.dataset.practice); return; }
  const b = t.closest('[data-buy]'); if (b) { buy(b.dataset.buy); return; }
  if (t.closest('[data-install]')) { installApp(); return; }
  if (t.closest('[data-hide-install]')) { P().hideInstall = true; Store.save(); renderLearn(); return; }
  if (t.closest('[data-switch]')) { showProfiles(); return; }
  if (t.closest('[data-mascot-live]') && P()) { Mascot.set(pick(['giggle', 'cheer', 'happy']), pick(MASCOTS[P().mascot].praise)); Sfx.pop(); return; }
  if (!t.closest('.pop-card')) $$('.pop-card').forEach(x => x.remove());
});
$('#l-main').onclick = () => Runner.main();
$('#l-close').onclick = () => Runner.askQuit();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) return closeSheet();
  if ($('#lesson').hidden || !$('#modal').hidden) return;
  if (e.key === 'Enter' && !$('#l-main').disabled && !e.target.closest('input')) { e.preventDefault(); Runner.main(); }
  else if (/^[1-9]$/.test(e.key) && Runner.select && !Runner.locked) Runner.select(+e.key - 1);
  else if (e.key === 'Escape') Runner.askQuit();
});
setInterval(() => { if (P() && !$('#app').hidden && $('#lesson').hidden) { const before = P().hearts; Hearts.sync(); if (P().hearts !== before) { Store.save(); renderChrome(); } } }, 60000);

  Tutor.init();
  if (window.DARI_PWA && 'serviceWorker' in navigator && location.protocol === 'https:') {

    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { r.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
})();
